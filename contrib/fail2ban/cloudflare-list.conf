# Fail2ban action: mirror bans into the Cloudflare account IP list "wicket_banned".
#
# Why: hosts on the Cloudflare tunnel never see the attacker's TCP connection (cloudflared
# makes it), so an iptables ban does nothing for them. The zone WAF rule
# `ip.src in $wicket_banned → block` does, on every proxied host. Direct hosts keep
# iptables; this action simply runs alongside it.
#
# Credentials: /etc/fail2ban/cloudflare-list.env (installed from cloudflare-list.env.example).
# Place: /etc/fail2ban/action.d/cloudflare-list.conf

[Definition]

actionstart = /bin/true

actionstop = /bin/true

actioncheck =

actionban = /bin/sh /etc/fail2ban/cloudflare-list.sh ban <ip> <name>

# Bans are permanent (bantime = -1) so this only fires on a manual `fail2ban-client unban`.
actionunban = /bin/sh /etc/fail2ban/cloudflare-list.sh unban <ip> <name>

[Init]
